name: Publish OTMA Swagger UI

on:
  push:
    branches: [main]
    paths:
      - 'otma-streetlight-backend/docs/**'
      - 'otma-streetlight-backend/openapi/**'
      - 'otma-streetlight-backend/deployment-templates/deploy-swagger-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Swagger site
        uses: actions/upload-pages-artifact@v3
        with:
          path: otma-streetlight-backend/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
